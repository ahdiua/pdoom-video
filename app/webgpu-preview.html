<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P(doom) — WebGPU Paperclips experiment</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050505; color: #eee9df; font: 14px system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
    #wrap { flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; overflow: hidden; }
    canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 16/9; object-fit: contain; }
    #ui { padding: 12px 16px; background: #111; display: grid; gap: 10px; }
    #controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, a { color: inherit; border: 1px solid #383632; border-radius: 4px; background: #151517; padding: 7px 10px; font: inherit; text-decoration: none; }
    button { cursor: pointer; } button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #ff4d12; outline-offset: 3px; }
    #seek { width: 100%; accent-color: #ff4d12; } #fullscreen { margin-left: auto; }
    #status { color: #9c978f; } #loading { position: fixed; inset: 0; display: grid; place-content: center; background: #050505; text-align: center; z-index: 2; }
    #loading[hidden] { display: none; } progress { width: min(400px, 80vw); accent-color: #ff4d12; }
    #wrap:fullscreen { background: #050505; } body.export #ui { display: none; }
    @media (max-width: 700px) { #ui { padding: 8px; } button, a { font-size: 12px; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite"><p id="loading-text">Preparing WebGPU Paperclips…</p><progress id="progress" aria-label="Preview preparation"></progress></div>
  <div id="wrap"><canvas id="c" aria-label="Paperclips music video preview"></canvas></div>
  <div id="ui" inert>
    <div id="controls">
      <button id="play" type="button">Play</button>
      <button id="resolution" type="button">Resolution</button>
      <span>3D detail: Full</span>
      <button id="motion-blur" type="button" aria-pressed="false">Motion blur: Off</button>
      <button id="grain" type="button" aria-pressed="false">Film grain: Off</button>
      <button id="loop" type="button" aria-pressed="true">Loop: On</button>
      <a id="webgl" href="./?only=paperclips&detail=full">WebGL preview</a>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
    <input id="seek" type="range" step="0.001" aria-label="Song time">
    <div id="status" role="status">WebGPU experiment · Paperclips · SDR · Full detail</div>
  </div>
  <script type="module" src="/src/webgpu/main.ts"></script>
</body>
</html>
